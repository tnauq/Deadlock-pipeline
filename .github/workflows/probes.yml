name: Probes

# Manual only. Kept out of "Daily refresh" because that job already spends ~16
# of the 20 SQL requests/hour the unkeyed API allows, and this needs 4 more.
# Run it in an hour with no scheduled job, or use the free-only mode.
#
# Cron fires at 00/04/08/12/16/20 UTC. Mid-window is safest.

on:
  workflow_dispatch:
    inputs:
      free_only:
        description: "Schemas and assets only - zero SQL queries, safe to run any time"
        required: false
        default: false
        type: boolean
      cohort_only:
        description: "Only the two item_cohort_stats tables (2 SQL calls; bans and badge already answered)"
        required: false
        default: false
        type: boolean
      duo_accounts:
        description: "CONTROL accounts for the duo probe (ceiling players are always seeded)"
        required: false
        default: "60"
        type: string
      lookback_days:
        description: "Days of ranked matches to scan"
        required: false
        default: "3"
        type: string
      calc_expected_items:
        description: "Shop catalogue size the calculator build asserts (156 as of 2026-08-05)"
        required: false
        default: "156"
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    # Needed by the calculator commit step at the bottom. Without it the push
    # 403s, which is how daily.yml failed silently before 2026-08-03.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ZERO SQL, no key. /v1/assets/heroes and /v1/assets/items only, so this
      # is safe in any hour and runs first — nothing downstream depends on it
      # and nothing it does can spoil the SQL budget for the steps that follow.
      # Answers the build-calculator questions: which hero stat fields exist and
      # their ranges, what an item `properties` entry actually looks like, the
      # distinct provided_property_type vocabulary, how many items carry
      # conditions or scaling, and the byte size of a trimmed client payload.
      # Field names are NOT assumed anywhere — it is a recursive key census over
      # whatever is present, because the shape of `properties` is the unknown.
      - name: Probe calculator data
        if: always()
        continue-on-error: true
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
        run: python3 probe_calc_data.py

      # ZERO SQL, no key. Emits docs/calc/{items,heroes,meta}.json — the static
      # bundles the build calculator reads — and, with --dump-raw, keeps the
      # unprocessed asset payloads so the transform can be iterated offline
      # without re-fetching. Commit docs/calc/ when the catalogue changes.
      #
      # The step FAILS if the catalogue is not exactly 156 items. That is
      # deliberate: a patch adding or removing an item should surface as a red
      # step with a diff in the log, not as a silently stale bundle. When it
      # trips, update ref/shop_items_wiki.json from deadlock.wiki/Items and
      # bump CALC_EXPECTED_ITEMS. continue-on-error keeps it from blocking the
      # rest of the run.
      - name: Build calculator data
        if: always()
        continue-on-error: true
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
          CALC_EXPECTED_ITEMS: ${{ inputs.calc_expected_items }}
        run: python3 build_calc_data.py --dump-raw raw

      # ZERO SQL — leaderboard is 100 req/s on its own bucket. Establishes
      # whether a RANKED leaderboard exists to cross-reference against, since
      # only ~42% of hero-board entries locate on the general board and
      # deadlock-api's own MMR spans Unranked too. Also re-tests whether
      # ranked_rank / badge_level have populated since the badge collapse.
      - name: Probe ranked leaderboard
        if: always()
        continue-on-error: true
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
        run: python3 probe_leaderboard_ranked.py

      # ZERO SQL. The processed board dropped account_id, badge_level,
      # ranked_rank and ranked_subrank — identity resolution now rests entirely
      # on possible_account_ids, which put the wrong player in 110 of 371 slots
      # when used alone. /raw is unread; if it carries the real ids this fixes
      # that outright.
      - name: Probe raw leaderboard
        if: always()
        continue-on-error: true
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
        run: python3 probe_leaderboard_raw.py

      # ONE /v1/sql call. Answers whether ability upgrade picks can be
      # displayed the way item frequency is: do ability ids repeat within a
      # build (one row per point), what upgrade_id holds, whether game_time_s
      # gives pick order, and whether picks line up with signature1-4.
      # The pipeline already reads these rows off items.* and discards them as
      # noise (PROBES.md finding 6) - this checks what is being thrown away.
      # Budget: pipeline 4 + duo 8 + this 1 = ~13 of the 20/hr cap.
      - name: Probe ability upgrades
        if: ${{ always() && !inputs.free_only }}
        continue-on-error: true
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
          PROBE_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python3 probe_abilities.py

      # Closes the open items in PROBES.md:
      #   banned_hero_ids        - ranked has a pregame lobby showing the enemy
      #                            team with one swap allowed, so counterpicking
      #                            is possible; is that visible in the data?
      #   item_cohort_stats_*    - two unused tables whose names suggest they do
      #                            server-side what the pipeline computes by hand
      #   upgrades.* vs items.*  - answered from the schema alone, no query
      #   average_badge          - has the 2026-07-31 zeroing resolved?
      # ZERO SQL. hero-stats is 100 req/s and batched, so this cannot touch the
      # 20/hr budget. Tests whether match_mode=ranked (lowercase, per the spec)
      # gives a ranked-native selector to replace leaderboard position.
      # ZERO SQL - leaderboard is 100 req/s. Cross-references each hero board
      # against the general board, which is the ceiling definition the pool
      # approach approximates badly: on 2026-08-03 Mirage NA's reported ceiling
      # was thirkl at position 379, while rocaine is #1 on the Mirage board and
      # inside the general top 8.
      # ZERO SQL. Infers duo-queue partners from match co-occurrence, since
      # match_player has no party column and the only party_* fields in the API
      # are for custom lobbies. hero-stats returns match id arrays per
      # (account, hero); accounts that keep appearing in the same matches are
      # queueing together.
      # The duo probe seeds from output/ceiling.csv, but output/ is gitignored
      # and this workflow does not otherwise run the pipeline — without this
      # step the probe would silently fall back to controls only, which is the
      # opposite of the point. Cheap now: the candidate pool moved off /v1/sql
      # onto hero-stats on 2026-08-03, so a pipeline run is ~4 SQL calls, not
      # the ~16 it used to be. Pipeline 4 + duo probe 8 = ~12 of the 20/hr cap.
      # Skipped under free_only, which spends SQL and so must not claim to be free.
      - name: Build ceiling data for seeding
        if: ${{ !inputs.free_only }}
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
          PER_REGION: "20"
          LEADERBOARD_DEPTH: "100"
          MATCH_MODE: "Ranked"
          REGIONS: "NAmerica,Europe"
        run: |
          python3 deadlock_pipeline.py
          python3 ceiling_rank.py

      # ~2 SQL calls plus MMR calls (separate bucket). Two questions: how many
      # ids fit one /v1/players/mmr call, which decides whether a DAILY ranked
      # ceiling from player_score is viable; and whether a ceiling player's
      # lobby-mates are of comparable standing, which would fix thin build
      # pools on boards too short to fill 20 samples.
      # Runs after the pipeline so output/ceiling.csv exists to seed from.
      - name: Probe MMR pool
        if: ${{ always() && !inputs.free_only }}
        continue-on-error: true
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
          PROBE_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python3 probe_mmr_pool.py

      # Team-confirmed duo detection from match ROSTERS. Replaces the
      # co-occurrence approach in probe_duos.py, which could not tell
      # teammates from opponents and whose 30% threshold sat at the 99th
      # percentile of chance. match_player carries account_id AND team, so a
      # teammate is a fact; the discriminator is the longest run of
      # CONSECUTIVE matches together, which matchmaking does not produce.
      # ~4 SQL calls at 60 seeds - do not run in the pipeline's hour.
      - name: Probe duos (rosters)
        if: ${{ always() && !inputs.free_only }}
        continue-on-error: true
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
          DUO_CONTROLS: ${{ inputs.duo_accounts }}
        run: python3 probe_duos_roster.py

      - name: Probe board cross-reference
        if: always()
        continue-on-error: true
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
        run: python3 probe_board_xref.py

      - name: Probe ranked hero-stats
        if: always()
        continue-on-error: true
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
        run: python3 probe_ranked_stats.py

      - name: Probe remaining
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
          PROBE_LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          SKIP_SQL: ${{ inputs.free_only && '1' || '0' }}
          COHORT_ONLY: ${{ inputs.cohort_only && '1' || '0' }}
        run: python3 probe_remaining.py

      # Probe findings only reached the run log before, which expires and cannot
      # be diffed. probe_calc_data.py in particular writes JSON that is meant to
      # be read, not scrolled past.
      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: |
            probe_out/
            output/
            docs/calc/
            raw/
          if-no-files-found: warn

      # probes.yml uploads artifacts; it does not otherwise write to the repo.
      # The calculator bundles are the exception: they are static site data
      # that docs/index.html fetches at runtime, so they have to be committed,
      # not just archived. Only changes when Valve patches the catalogue, so
      # this is a no-op commit on most runs.
      #
      # `git add -f` is deliberate: docs/calc/ can be swept up by a broad
      # gitignore rule (output/, *.json), and a silently ignored path is
      # exactly how this folder failed to appear the first time.
      - name: Commit calculator data
        if: always()
        continue-on-error: true
        run: |
          if [ ! -f docs/calc/items.json ]; then
            echo "no docs/calc/items.json - the build step did not produce one"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/calc/
          if git diff --staged --quiet; then
            echo "calculator bundles unchanged"
          else
            git commit -m "calc: rebuild item and hero bundles"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "committed docs/calc/"
          fi
