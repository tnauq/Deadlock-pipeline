name: Deadlock pipeline

on:
  push:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run pipeline
        run: |
          ls -la
          SCRIPT=$(find . -maxdepth 2 -name '*.py' -not -path './.git/*' | head -1)
          echo "Running: $SCRIPT"
          python3 "$SCRIPT"

      - name: Upload CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadlock-output
          path: output/
