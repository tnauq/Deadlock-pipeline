name: Top heroes

# Standalone. Does NOT run the pipeline and must not overlap with it — both
# draw on the same /v1/sql bucket and the binding limit is 20 requests per
# HOUR per IP, not 2 per minute.
#
# As of the 2026-09-03 run, /v1/players/hero-stats HONOURS
# min_unix_timestamp / max_unix_timestamp, so top_heroes.py resolves the whole
# board out of the free 100 req/s bucket and spends NO SQL budget. Both
# regions is therefore cheap and is the default. SQL is only reached if that
# window parameter stops being honoured; the concurrency group and the
# projected-call guard inside the script cover that case.
#
# assign_tiers.py computes ALL SEVEN orderings on every run regardless of
# which one is published — strict_1, fallback_2, fallback_3, scarcity_3,
# scarcity_pct, expected_pos and hybrid all land in tier_sensitivity.csv. The
# `ordering` input only decides which one tier_assignment.csv is written from,
# so choosing wrong costs nothing but a re-read of the sensitivity file.

on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Regions. Both is free while hero-stats honours a time window."
        default: "NAmerica,Europe"
        type: choice
        options:
          - "NAmerica,Europe"
          - "NAmerica"
          - "Europe"
      days:
        description: "Lookback window in days"
        default: "14"

      ordering:
        description: "Which ordering tier_assignment.csv is written from. All seven are always computed."
        default: "scarcity_3"
        type: choice
        options:
          - "scarcity_3"     # near-ties broken toward the rarer hero, absolute band
          - "scarcity_pct"   # same, band proportional to the player's own top count
          - "hybrid"         # scarcity_3, but heroes with an extreme ratio are moved
          - "expected_pos"   # full rerank on observed / expected position
          - "fallback_3"     # raw most-played, no scarcity tiebreak
          - "fallback_2"
          - "strict_1"
      margin:
        description: "Absolute tie band in games (scarcity_3). 3 = never fires; 5-8 is the plateau; past 12 is noise."
        default: "5"
        type: choice
        options: ["5", "3", "8", "12"]
      margin_pct:
        description: "Proportional tie band as a fraction of the player's own top count (scarcity_pct)."
        default: "0.15"
        type: choice
        options: ["0.15", "0.10", "0.20", "0.30"]
      hybrid_p:
        description: "Hybrid moves a hero only when its ratio is this unlikely under Exponential(1). Lower = fewer heroes move."
        default: "0.10"
        type: choice
        options: ["0.10", "0.05", "0.20"]
      assign_for_expected:
        description: "Which assignment expected_pos/hybrid rerank. Must match `ordering` to compare like with like."
        default: "scarcity_3"
        type: choice
        options: ["scarcity_3", "fallback_3", "scarcity_pct"]
      pool_regions:
        description: "0 = rank regions separately (NA and EU orderings measured uncorrelated). 1 = pool them."
        default: "0"
        type: choice
        options: ["0", "1"]
      scarcity_pref:
        description: "Only used when `ordering` is left unset. 1 = scarcity_3, 0 = fallback_N."
        default: "1"
        type: choice
        options: ["1", "0"]
      fallback_depth:
        description: "How far down a player's most-played list to look for an unclaimed hero, when scarcity is off."
        default: "3"
        type: choice
        options: ["3", "2", "1"]

      allow_sql:
        description: "1 = fall through to SQL if the hero-stats time window stops working. 0 = stop at unwindowed career stats (free, but NOT the last N days)."
        default: "1"
        type: choice
        options: ["1", "0"]
      min_account_games:
        description: "Games in the window below which a candidate id is treated as unresolved"
        default: "20"
      max_ids_per_entry:
        description: "Candidate ids kept per board entry. 2 is measured best; 1 halves any SQL cost at ~8% accuracy loss."
        default: "2"
        type: choice
        options: ["2", "1"]

concurrency:
  # never let two of these overlap, and share this group with the pipeline
  # workflow so they cannot burn the hourly SQL budget against each other
  group: deadlock-sql
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve board -> top heroes
        env:
          REGIONS: ${{ inputs.regions }}
          DAYS: ${{ inputs.days }}
          ALLOW_SQL: ${{ inputs.allow_sql }}
          MIN_ACCOUNT_GAMES: ${{ inputs.min_account_games }}
          MAX_IDS_PER_ENTRY: ${{ inputs.max_ids_per_entry }}
          # Optional. Raises the SQL limit; the script works without it.
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
        run: python3 top_heroes.py

      - name: Assign heroes to board positions
        # Runs even if the step above failed partway, so a truncated
        # top_heroes.csv still produces something inspectable rather than
        # nothing. assign_tiers.py exits with a clear message if the file is
        # missing entirely.
        if: always()
        env:
          ORDERING: ${{ inputs.ordering }}
          MARGIN: ${{ inputs.margin }}
          MARGIN_PCT: ${{ inputs.margin_pct }}
          HYBRID_P: ${{ inputs.hybrid_p }}
          ASSIGN_FOR_EXPECTED: ${{ inputs.assign_for_expected }}
          POOL_REGIONS: ${{ inputs.pool_regions }}
          SCARCITY_PREF: ${{ inputs.scarcity_pref }}
          FALLBACK_DEPTH: ${{ inputs.fallback_depth }}
        run: python3 assign_tiers.py

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadlock-top-heroes
          # Directory, not a filename list. An explicit list is how
          # identity_audit.csv went missing for a full run — a new output file
          # silently never gets collected and nothing warns.
          path: output/
          retention-days: 7
