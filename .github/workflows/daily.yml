name: Daily refresh

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours, on the hour (00/04/08/12/16/20 UTC)
                            # was daily; raised while ranked mode saturates
  workflow_dispatch:

# The commit step pushes docs/data.json, icons and the archive back to the repo,
# so the job needs write access. Without this the default GITHUB_TOKEN may be
# read-only and the push fails with 403 "Permission to ... denied to
# github-actions[bot]" AFTER the commit succeeds, which reads like a pipeline
# failure but is purely a permissions one.
permissions:
  contents: write

# Three workflows can now push to docs/ (this one, probes.yml, comps.yml) and
# every push triggers a Pages deployment. Pages runs ONE deployment at a time,
# so overlapping pushes leave deployments sitting in `deployment_queued` until
# they hit the 600s timeout and cancel — with no error anywhere in this job.
# cancel-in-progress stays FALSE: a superseded data refresh should still finish
# committing, it just publishes a moment later.
concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PER_REGION 20 gives NA and EU their own set of ~20 builds each.
      # LEADERBOARD_DEPTH 100 is the backfill room to find 20 QUALIFYING
      # players per region. Depth costs almost nothing in quality: the
      # SQL_BADGE_FLOOR of 110 (Eternus) gates entry regardless of ladder
      # position, and median mmr falls only ~0.7 across the first 40 places.
      # RECENCY_WINDOW stays at 25 deliberately — 99% of qualifying players
      # played the hero within their last 20 games, so widening it would add
      # almost no volume while letting stale builds in.
      #
      # MATCH_MODE=Ranked, set 2026-07-30. Deadlock's ranked mode is new and
      # thin (~1,080 games total across a 3-day sample vs ~841k Unranked, per
      # diagnose_match_mode.py) — deliberate choice to run on partial data now
      # and let the daily cron accumulate real ranked volume over time, rather
      # than keep pooling ranked into the unranked cohort indefinitely.
      # EXPECT EARLY RUNS TO BE THIN. build_site_data.py refuses to publish
      # below MIN_HEROES=30, so if ranked volume is too low for enough heroes
      # to qualify, the build step fails on purpose and yesterday's data.json
      # stays live — that's the safety net working, not a bug. Revisit this
      # setting once hero-region coverage looks like it did under Unranked.
      # Candidate selection no longer filters on badge at all (removed
      # 2026-07-31). average_badge_team0/1 on match_player went to a
      # populated-but-zero state across the entire ranked dataset after the
      # 2026-07-30 soft reset and never recovered within the same day — see
      # diagnose_badge_gap.py's findings if this needs revisiting. The pool is
      # now driven directly by account ids seen on Valve's own per-hero
      # leaderboards (fetch_ladders), which is the actual "top players" signal
      # this site needs and doesn't depend on match_player's badge fields at
      # all. mmr/median_mmr in tierlist.csv may still read oddly while badge
      # is broken upstream — that's cosmetic and reference-only, not published
      # to the site (see build_site_data.py).
      - name: Run pipeline
        env:
          DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
          PER_REGION: "20"
          LEADERBOARD_DEPTH: "100"
          MATCH_MODE: "Ranked"
          REGIONS: "NAmerica,Europe"
        run: python3 deadlock_pipeline.py

      - name: Fetch any new icons
        run: |
          python3 fetch_icons.py
          mkdir -p docs/icons
          cp -n icons/*.png docs/icons/ 2>/dev/null || true

      # Ranks each hero by its strongest player's ladder position, per region.
      # Must run BEFORE the builder: the site's ordering and tiers come from
      # output/ceiling.csv. No continue-on-error now that it is load-bearing.
      - name: Ceiling ranking
        run: python3 ceiling_rank.py

      # exits non-zero on obviously broken data, which fails the job and
      # leaves the last good docs/data.json in place
      - name: Build site data
        run: python3 build_site_data.py

      # Build-calculator bundles: 156 shop items and 38 hero stat blocks, read
      # by docs/index.html at runtime. ZERO SQL — /v1/assets only, so this
      # cannot touch the 20/hr budget and is safe in the same run as the
      # pipeline. Rebuilt every run so a Valve patch shows up within 4 hours
      # rather than waiting for someone to trigger probes.yml by hand.
      #
      # continue-on-error is deliberate: the build FAILS if the catalogue is
      # not exactly 156 items, which is the intended alarm for a patch. That
      # alarm must not take the data refresh down with it — the previous
      # bundles stay live and the tier list publishes as normal.
      - name: Build calculator data
        if: always()
        continue-on-error: true
        run: python3 build_calc_data.py

      # docs/ plus archive/ are committed. output/ still stays off the repo:
      # candidates.csv and excluded.csv carry Steam account IDs and display
      # names. Nothing in the archive contains account-level data.
      #
      # One trimmed snapshot per region per DAY, for charting change over time.
      # The pipeline runs 6x/day but builds are a 20-player sample, so runs 4h
      # apart differ mostly by noise — the script no-ops if today's file for
      # this region already exists. JSON is uncompressed and lives in docs/ so
      # the site can fetch it directly (Pages gzips text in transit anyway);
      # raw CSVs go to archive/ OUTSIDE docs/ so they don't count against the
      # 1GB published-Pages limit. ~53MB/yr in docs/, ~33MB/yr in archive/.
      - name: Archive daily snapshot
        run: python3 archive_snapshot.py

      # `git add -f` on docs/calc: a broad gitignore rule (output/, *.json)
      # can swallow it silently, which is exactly how the folder failed to
      # appear the first time. The 2>/dev/null guard lets the commit proceed
      # when the calculator step was skipped or failed.
      - name: Commit if changed
        run: |
          git config user.name  "deadlock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/icons docs/archive archive
          git add -f docs/calc 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Artifacts on a public repo are downloadable by anyone, so the
      # player-level CSVs are excluded here too.
      - name: Upload aggregate CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadlock-aggregates
          retention-days: 7
          path: |
            output/tierlist.csv
            output/item_frequency.csv
            output/hero_splits.csv
            output/ceiling.csv
