name: Daily refresh

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours, on the hour (00/04/08/12/16/20 UTC)
                            # was daily; raised while ranked mode saturates
  workflow_dispatch:
    inputs:
      match_mode:
        description: "Applies to BOTH scripts. Empty = standard play (default). Ranked restores the retired ranked cohort."
        default: ""
        type: choice
        options: ["", "Unranked", "Ranked"]

# The commit step pushes docs/data.json, icons and the archive back to the repo,
# so the job needs write access. Without this the default GITHUB_TOKEN may be
# read-only and the push fails with 403 "Permission to ... denied to
# github-actions[bot]" AFTER the commit succeeds, which reads like a pipeline
# failure but is purely a permissions one.
permissions:
  contents: write

# Three workflows can now push to docs/ (this one, probes.yml, comps.yml) and
# every push triggers a Pages deployment. Pages runs ONE deployment at a time,
# so overlapping pushes leave deployments sitting in `deployment_queued` until
# they hit the 600s timeout and cancel — with no error anywhere in this job.
# cancel-in-progress stays FALSE: a superseded data refresh should still finish
# committing, it just publishes a moment later.
concurrency:
  group: site-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    # MATCH_MODE MOVED TO JOB LEVEL — 2026-09-04.
    #
    # It was set per-step on "Run pipeline" only, so ceiling_rank.py never saw
    # it and fell back to its own default. The 13:43 run built the cohort,
    # items, pool net wins and elite_winrate on RANKED while the ceiling and
    # every identity check ran over ALL modes — two halves of one artifact
    # describing different populations, with nothing in the output saying so.
    # Defined once here, it is inherited by every step and cannot drift again.
    #
    # DEFAULT IS NOW "" (standard play). The ranked experiment described below
    # is over: volume never accumulated the way the comment hoped, the ladder
    # feeding it degraded, and ordering on ranked win rate turned out to select
    # on the very quantity being reported. Expect elite_winrate to fall ~4
    # points versus ranked runs — that is the selection inflation coming out,
    # not a regression. Set match_mode=Ranked on a manual dispatch to compare.
    #
    # PER_REGION 20 gives NA and EU their own set of ~20 builds each.
    # LEADERBOARD_DEPTH 100 is the backfill room to find 20 QUALIFYING
    # players per region. RECENCY_WINDOW stays at 25 deliberately — 99% of
    # qualifying players played the hero within their last 20 games, so
    # widening it would add almost no volume while letting stale builds in.
    #
    # Candidate selection does not filter on badge at all (removed
    # 2026-07-31): average_badge_team0/1 went populated-but-zero after the
    # 2026-07-30 soft reset and never recovered. The pool is driven by account
    # ids seen on Valve's own leaderboards, cross-referenced against the
    # general board, which does not depend on match_player's badge fields.
    env:
      DEADLOCK_API_KEY: ${{ secrets.DEADLOCK_API_KEY }}
      PER_REGION: "20"
      LEADERBOARD_DEPTH: "100"
      MATCH_MODE: ${{ inputs.match_mode }}
      REGIONS: "NAmerica,Europe"
      # Window for the RECENCY counts only. Identity checks always test the
      # CAREER record: a wrong account id is a career-level property, whereas a
      # fortnight off is a recency fact, and testing identity against a window
      # rejects real accounts for being inactive.
      RECENT_DAYS: "30"
      # Third identity channel: /v1/analytics/scoreboards/players, the only
      # endpoint publishing real account ids. 200 req/min analytics bucket, so
      # it cannot touch the 20/hr SQL budget.
      SCOREBOARD_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show effective settings
        # Both scripts print their own mode line. This is the contract they
        # are supposed to agree with — if the three ever disagree again, it is
        # visible in the first 20 lines rather than 10 minutes in.
        run: |
          echo "MATCH_MODE='${MATCH_MODE}' (empty = standard play, no filter)"
          echo "REGIONS=${REGIONS} PER_REGION=${PER_REGION} DEPTH=${LEADERBOARD_DEPTH}"
          echo "RECENT_DAYS=${RECENT_DAYS} SCOREBOARD_CHECK=${SCOREBOARD_CHECK}"

      - name: Run pipeline
        run: python3 deadlock_pipeline.py

      - name: Fetch any new icons
        run: |
          python3 fetch_icons.py
          mkdir -p docs/icons
          cp -n icons/*.png docs/icons/ 2>/dev/null || true

      # Ranks each hero by its strongest player's ladder position, per region.
      # Must run BEFORE the builder: the site's ordering and tiers come from
      # output/ceiling.csv. No continue-on-error now that it is load-bearing.
      - name: Ceiling ranking
        run: python3 ceiling_rank.py

      # exits non-zero on obviously broken data, which fails the job and
      # leaves the last good docs/data.json in place
      - name: Build site data
        run: python3 build_site_data.py

      # Build-calculator bundles: 156 shop items and 38 hero stat blocks, read
      # by docs/index.html at runtime. ZERO SQL — /v1/assets only, so this
      # cannot touch the 20/hr budget and is safe in the same run as the
      # pipeline. Rebuilt every run so a Valve patch shows up within 4 hours
      # rather than waiting for someone to trigger probes.yml by hand.
      #
      # continue-on-error is deliberate: the build FAILS if the catalogue is
      # not exactly 156 items, which is the intended alarm for a patch. That
      # alarm must not take the data refresh down with it — the previous
      # bundles stay live and the tier list publishes as normal.
      - name: Build calculator data
        if: always()
        continue-on-error: true
        run: python3 build_calc_data.py

      # Reads candidates.csv (account ids, never committed or uploaded) and
      # source_items.csv, and emits output/orbit_audit.csv — per hero-region
      # aggregates only. Answers whether orbit-sourced builds actually differ
      # from board-sourced ones, which is what decides whether a rising orbit
      # share matters. Zero API calls.
      - name: Audit the orbit fill
        if: always()
        continue-on-error: true
        run: python3 orbit_audit.py

      # docs/ plus archive/ are committed. output/ still stays off the repo:
      # candidates.csv, excluded.csv and identity_audit.csv carry Steam account
      # IDs and display names. Nothing in the archive contains account-level
      # data.
      #
      # One trimmed snapshot per region per DAY, for charting change over time.
      # The pipeline runs 6x/day but builds are a 20-player sample, so runs 4h
      # apart differ mostly by noise — the script no-ops if today's file for
      # this region already exists. JSON is uncompressed and lives in docs/ so
      # the site can fetch it directly (Pages gzips text in transit anyway);
      # raw CSVs go to archive/ OUTSIDE docs/ so they don't count against the
      # 1GB published-Pages limit. ~53MB/yr in docs/, ~33MB/yr in archive/.
      - name: Archive daily snapshot
        run: python3 archive_snapshot.py

      # `git add -f` on docs/calc: a broad gitignore rule (output/, *.json)
      # can swallow it silently, which is exactly how the folder failed to
      # appear the first time. The 2>/dev/null guard lets the commit proceed
      # when the calculator step was skipped or failed.
      - name: Commit if changed
        run: |
          git config user.name  "deadlock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json docs/icons docs/archive archive
          git add -f docs/calc 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Artifacts on a public repo are downloadable by anyone, so the
      # player-level CSVs are excluded here. That is why output/ is NOT
      # globbed and why output/ability_order.csv is NOT listed: it carries
      # account ids so that build_site_data.py can pick out the ceiling
      # player's pick order, and it must stay on the runner.
      #
      # identity_audit.csv is excluded for the same reason — it names every
      # rejected board claim, with account_name and account_id. Its aggregate
      # companion identity_summary.csv carries COUNTS ONLY (per hero-region
      # rejection reasons, plus a totals row with the scoreboard agreement
      # figures) and is safe to publish, so that is what is listed instead.
      - name: Upload aggregate CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deadlock-aggregates
          retention-days: 7
          path: |
            output/tierlist.csv
            output/item_frequency.csv
            output/hero_splits.csv
            output/ceiling.csv
            output/ability_frequency.csv
            output/imbue_frequency.csv
            output/source_items.csv
            output/orbit_audit.csv
            output/identity_summary.csv
            output/pool_audit.csv
            output/items_manifest.json
