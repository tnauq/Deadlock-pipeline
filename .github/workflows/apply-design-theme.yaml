name: Apply design theme

# Port the LOOK of the Claude Design mockup onto the real site: palette,
# type, the squared-off geometry, and the stacked masthead. Nothing here
# touches the JavaScript — every selector below already exists in the page,
# so all 38 heroes, both regions, the item columns, imbue, ability points
# and the calculator keep working exactly as they do now.
#
# Three edits, all reversible:
#   1. a Google Fonts <link> in <head>          (Archivo / Archivo Black / JetBrains Mono)
#   2. a theme <style> block after the last </style>
#   3. the <header> markup, for the stacked "PEAK POTENTIAL TIER LIST" title
#
#   Actions -> Apply design theme -> Run workflow
#     apply    false (default) = artifact only. true = commit
#     revert   true = undo all three edits
#
# Supersedes apply-design-motion.yml — the motion rules are folded in here.
# If that block is present it is removed first, so the two cannot fight.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Commit the change (false = dry run)"
        required: false
        default: "false"
      revert:
        description: "Undo the theme"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT || github.token }}

      - name: Apply
        env:
          REVERT: ${{ github.event.inputs.revert }}
        run: |
          python3 - <<'PY'
          import os, re, sys, pathlib

          TARGET = pathlib.Path("docs/index.html")
          OUT = pathlib.Path("output"); OUT.mkdir(exist_ok=True)
          REVERT = (os.environ.get("REVERT") or "false").lower() == "true"

          B = "/* === design-theme: begin (generated) === */"
          E = "/* === design-theme: end === */"
          FONTS_B = "<!-- design-theme fonts: begin -->"
          FONTS_E = "<!-- design-theme fonts: end -->"
          HDR_B = "<!-- design-theme header: begin -->"
          HDR_E = "<!-- design-theme header: end -->"

          if not TARGET.exists():
              sys.exit("%s missing." % TARGET)
          site = TARGET.open("r", encoding="utf-8", newline="").read()
          (OUT / "index.before.html").write_text(site, "utf-8")

          if "data-dc-script" in site:
              sys.exit("docs/index.html is the Design mock, not the site. Run 'Restore site'.")

          ORIG_HEADER = """<header>
            <div class="eyebrow">Deadlock</div>
            <h1>Tier List</h1>
            <p class="sub" id="sub">Loading…</p>
            <div class="regions" id="regions" role="group" aria-label="Region"></div>
          </header>"""

          NEW_HEADER = HDR_B + """
          <header>
            <div class="eyebrow">Deadlock · unofficial</div>
            <h1><span>Peak</span><span>Potential</span><span class="muted">Tier List</span></h1>
            <p class="blurb">Every hero ranked by its single strongest player on the regional
            ladder — not a pool average. Pick a hero to see what the top 20 actually buy.</p>
            <p class="sub" id="sub">Loading…</p>
            <div class="regions" id="regions" role="group" aria-label="Region"></div>
          </header>
          """ + HDR_E

          # ---- strip the older motion-only block if it is still there --------
          site = re.sub(r"/\* === design-motion: begin \(generated\) === \*/.*?"
                        r"/\* === design-motion: end === \*/", "", site, flags=re.S)
          site = re.sub(r"<style>\s*</style>\s*", "", site)

          # ---- 1. remove any previous run of THIS workflow -------------------
          had = B in site
          site = re.sub(re.escape(B) + r".*?" + re.escape(E), "", site, flags=re.S)
          # \n* so removing the block does not leave the blank lines behind
          site = re.sub(re.escape(FONTS_B) + r".*?" + re.escape(FONTS_E) + r"\n*",
                        "", site, flags=re.S)
          site = re.sub(re.escape(HDR_B) + r".*?" + re.escape(HDR_E),
                        ORIG_HEADER, site, flags=re.S)
          site = re.sub(r"<style>\s*</style>\s*", "", site)

          if REVERT:
              if not had:
                  print("no theme block present")
              TARGET.open("w", encoding="utf-8", newline="").write(site)
              (OUT / "index.after.html").write_text(site, "utf-8")
              print("reverted")
              raise SystemExit(0)

          # ---- 2. fonts ------------------------------------------------------
          FONTS = (FONTS_B + '\n'
            '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
            '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n'
            '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?'
            'family=Archivo:wght@500;600;700;800&family=Archivo+Black&'
            'family=JetBrains+Mono:wght@500;700;800&display=swap">\n' + FONTS_E)
          i = site.find("<style>")
          if i == -1:
              sys.exit("No <style> to anchor the font links to.")
          site = site[:i] + FONTS + "\n" + site[i:]

          # ---- 3. header -----------------------------------------------------
          if ORIG_HEADER not in site:
              sys.exit("The <header> block does not match what this workflow expects. "
                       "It was written against the restored site verbatim; if the header "
                       "has been edited since, update ORIG_HEADER.")
          site = site.replace(ORIG_HEADER, NEW_HEADER, 1)

          # ---- 4. theme ------------------------------------------------------
          CSS = B + """
          /* Everything below overrides the base stylesheet by cascade order —
             the original rules are untouched, so removing this block restores
             the previous appearance exactly. */

          :root{
            --bg:#101218; --panel:#161923; --panel-2:#1b1f2a; --frame:#262b38;
            --text:#e8eaf0; --dim:#8e96a9; --ink:#101218; --accent:#e0b06a;
            --s:#e05a5a; --a:#e0913c; --b:#8fae4e; --c:#4a8ea3; --d:#5f677a;
            --cat-g:#e0752a; --cat-s:#8b4fd6; --cat-v:#3fa65c;
            --sans:Archivo,ui-sans-serif,system-ui,-apple-system,sans-serif;
            --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
            --display:'Archivo Black',Archivo,sans-serif;
          }
          html{background:#101218!important}
          .backdrop{background:#101218}
          body{
            background:radial-gradient(120% 60% at 12% -10%,#1d2130 0%,#101218 60%)!important;
            background-attachment:fixed;
            max-width:1240px;font-size:14.5px;
          }

          /* Squared geometry. The mockup is built on 1-2px corners throughout;
             pills and 10-14px radii are what read as "the old page". */
          .tier-row,.tile,.slot,.slots,.panel,.apts,.fx,.other,.abd,
          .pick-box,.btn,.more,.empty-state,.note,.pick-row,.pick-top input{
            border-radius:2px;
          }
          .hero .ic,.tile .ic,.slot .ic,.apc .ic,.pick-row .ic,.hero-head .ic,
          .seq .s .ic,.imb-row .regions button .ic{border-radius:2px}
          .regions,.regions button,.chip,.badge,.seq .s,.pip{border-radius:1px}
          .tile .n,.slot .tierbadge,.slot .imb{border-radius:1px}
          .slot .rm{border-radius:50%}

          /* ---------- masthead ---------- */
          header{padding:44px 0 22px;border-bottom:1px solid var(--frame)}
          .eyebrow{
            display:flex;align-items:center;gap:10px;
            font:700 11px/1 var(--sans);letter-spacing:.34em;color:var(--dim);
          }
          .eyebrow::before{
            content:"";width:26px;height:3px;background:var(--accent);flex:0 0 auto;
          }
          h1{
            font-family:var(--display);font-weight:400;
            font-size:clamp(34px,7vw,72px);line-height:.92;letter-spacing:-.02em;
            margin:14px 0 0;text-transform:uppercase;
          }
          h1 span{display:block}
          h1 .muted{color:var(--dim)}
          .blurb{
            margin:16px 0 0;max-width:46ch;color:#9aa2b4;
            font-size:14.5px;line-height:1.6;text-wrap:pretty;
          }
          .sub{margin-top:14px;font-family:var(--mono);font-size:11px;
            letter-spacing:.04em;color:#6f7789}

          /* ---------- region switch ---------- */
          .regions{
            margin-top:16px;padding:3px;gap:3px;
            background:#171a23;border:1px solid var(--frame);
          }
          .regions button{
            min-width:74px;padding:9px 16px;
            font:700 11.5px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;
            transition:background .2s,color .2s,letter-spacing .2s,transform .12s;
          }
          .regions button[aria-pressed=true]{background:var(--text);color:var(--ink)}
          .regions button:hover{letter-spacing:.22em;color:var(--text)}
          .regions button:active{transform:scale(.95)}

          /* ---------- tier rows ---------- */
          #tiers{padding-top:28px;display:grid;gap:10px}
          .tier-row{
            background:#161923;border:1px solid var(--frame);
            margin-bottom:0;gap:0;align-items:stretch;
          }
          .tier-row:has(.tier-chip[data-t=S]){border-left:3px solid var(--s)}
          .tier-row:has(.tier-chip[data-t=A]){border-left:3px solid var(--a)}
          .tier-row:has(.tier-chip[data-t=B]){border-left:3px solid var(--b)}
          .tier-row:has(.tier-chip[data-t=C]){border-left:3px solid var(--c)}
          .tier-row:has(.tier-chip[data-t=D]){border-left:3px solid var(--d)}
          .tier-chip{
            flex-basis:52px;background:transparent!important;
            border-right:1px solid var(--frame);
            font-family:var(--display);font-weight:400;font-size:22px;
          }
          .tier-chip[data-t=S]{color:var(--s)} .tier-chip[data-t=A]{color:var(--a)}
          .tier-chip[data-t=B]{color:var(--b)} .tier-chip[data-t=C]{color:var(--c)}
          .tier-chip[data-t=D]{color:var(--d)}
          .strip{padding:10px 10px 10px 10px;gap:8px}

          /* ---------- hero tiles ---------- */
          .hero .ic{
            border:1px solid #2c3240;
            transition:border-color .18s,box-shadow .25s,
                       transform .2s cubic-bezier(.2,.9,.3,1.3);
          }
          .hero .nm{font:600 10.5px/1.2 var(--sans);transition:color .18s}
          .hero:hover .ic{transform:translateY(-4px);border-color:var(--dim)}
          .hero:active .ic{transform:translateY(-1px) scale(.96)}
          .hero[aria-pressed=true] .ic{
            border-color:var(--accent);transform:translateY(-3px);
            box-shadow:0 6px 22px -6px rgba(224,176,106,.55);
          }
          @media (hover:none){
            .hero:hover .ic{transform:none;border-color:#2c3240}
            .hero[aria-pressed=true]:hover .ic{border-color:var(--accent)}
            .regions button:hover{letter-spacing:.16em;color:var(--dim)}
            .regions button[aria-pressed=true]:hover{color:var(--ink)}
          }

          /* ---------- labels, numbers ---------- */
          .section-label{font-size:10.5px;letter-spacing:.28em;color:var(--dim)}
          .hero-head h2{font-family:var(--display);font-weight:400;letter-spacing:-.01em}
          .col h3{font:700 11px/1 var(--mono);letter-spacing:.06em;color:var(--dim);
            text-transform:uppercase}
          .col .rule{height:1px;background:var(--frame);border-radius:0}
          .tile .n,.panel .r .n,.abd-r .n,.other b,.seq .s .c,.badge{
            font-family:var(--mono);font-variant-numeric:tabular-nums}
          .badge.tier{font-family:var(--sans);letter-spacing:.1em}
          .num{font-family:var(--mono)}

          /* ---------- footer ---------- */
          footer{margin-top:48px;border-top:1px solid var(--frame)}
          .method dt{letter-spacing:.24em;font-size:9.5px;color:var(--accent)}
          """ + E

          j = site.rfind("</style>")
          if j == -1:
              sys.exit("No </style> to anchor the theme to.")
          j += len("</style>")
          site = site[:j] + "\n<style>\n" + CSS + "\n</style>" + site[j:]

          if "data.json" not in site:
              sys.exit("Refusing: result no longer references data.json.")
          for need in (".regions button", ".hero .ic", ".tier-chip"):
              if need not in site:
                  sys.exit("Lost selector %s — aborting." % need)

          TARGET.open("w", encoding="utf-8", newline="").write(site)
          (OUT / "index.after.html").write_text(site, "utf-8")
          print("theme applied (%s)" % ("re-applied" if had else "first run"))
          PY

      - name: Upload for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-theme
          path: output/

      - name: Commit
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || git commit -m "apply design theme to site"
          git push
